<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Logic Circuit Designer &amp; Analyzer | Online Logic Simulator</title>
    <meta name="description" content="Design, simulate, and analyze digital logic circuits online. Build circuits with logic gates, adders, comparators, multiplexers, decoders, and flip-flops; explore truth tables, Boolean equations, Karnaugh maps, and timing diagrams.">
    <meta name="keywords" content="digital logic simulator, logic gate simulator online, digital circuit designer, logic circuit builder, Boolean algebra, truth table generator, Karnaugh map, digital electronics, Essam Assaf">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Essam Mohamed Al-Assaf">
    <link rel="canonical" href="https://essamassaf.github.io/DigitalLogicAnalyzer/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Digital Logic Circuit Designer &amp; Analyzer | Online Logic Simulator">
    <meta property="og:description" content="Build, simulate, and analyze digital logic circuits online with logic gates, truth tables, Boolean equations, Karnaugh maps, and timing diagrams.">
    <meta property="og:url" content="https://essamassaf.github.io/DigitalLogicAnalyzer/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Digital Logic Circuit Designer &amp; Analyzer">
    <meta name="twitter:description" content="Online digital logic circuit design, simulation, and analysis by Essam Mohamed Al-Assaf.">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"SoftwareApplication","name":"Digital Logic Circuit Designer & Analyzer","url":"https://essamassaf.github.io/DigitalLogicAnalyzer/","description":"A browser-based tool for designing, simulating, and analyzing digital logic circuits with logic gates and digital components, truth tables, Boolean equations, Karnaugh maps, and timing diagrams.","applicationCategory":"EducationalApplication","operatingSystem":"Web browser","inLanguage":"en","author":{"@type":"Person","name":"Essam Mohamed Al-Assaf"}}
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="brand-header">
    <img class="brand-logo brand-logo-left" src="assets/caluni-logo.png" alt="CalUni — California University of Science and Technology">
    <div class="brand-heading">
        <h1>Digital Logic Circuit Designer & Analyzer</h1>
        <p>Digital Logic Design and Simulation</p>
    </div>
    <img class="brand-logo brand-logo-right" src="assets/essam-assaf.png" alt="ESSAM ASSAF 1978">
</header>
<nav class="toolbar">
    <button id="newBtn">New</button>
    <button id="openBtn">Open</button>
    <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="saveBtn">Save</button>
    <button id="printBtn">Print</button>
    <button id="exportBtn">Export PDF</button>
    <button id="runBtn" class="run-button" type="button" disabled title="Simulation will be available after outputs are added">▶ Run</button>
    <button id="helpBtn">Help</button>
</nav>
<main class="workspace">

    <section class="circuit-section">

        <h2>Circuit Design Area</h2>

        <div class="circuit-container">

            <aside class="components-panel">
                <h3>Components</h3>
                <div class="component-columns">
                    <section class="component-column inputs-column" aria-label="Logic inputs">
                        <h4>Inputs <small>(Editable)</small></h4>
                        <div class="input-row" data-input-key="A">
                            <button type="button" class="input-add" title="Add input A to canvas" aria-label="Add input A">
                                <span class="input-symbol">A</span>
                            </button>
                            <button type="button" class="input-switch on" aria-pressed="true" title="Toggle input A"><span class="input-value">1</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input A" aria-label="Rename input A">✎</button>
                        </div>
                        <div class="input-row" data-input-key="B">
                            <button type="button" class="input-add" title="Add input B to canvas" aria-label="Add input B">
                                <span class="input-symbol">B</span>
                            </button>
                            <button type="button" class="input-switch" aria-pressed="false" title="Toggle input B"><span class="input-value">0</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input B" aria-label="Rename input B">✎</button>
                        </div>
                        <div class="input-row" data-input-key="C">
                            <button type="button" class="input-add" title="Add input C to canvas" aria-label="Add input C">
                                <span class="input-symbol">C</span>
                            </button>
                            <button type="button" class="input-switch" aria-pressed="false" title="Toggle input C"><span class="input-value">0</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input C" aria-label="Rename input C">✎</button>
                        </div>
                        <div class="input-row" data-input-key="D">
                            <button type="button" class="input-add" title="Add input D to canvas" aria-label="Add input D">
                                <span class="input-symbol">D</span>
                            </button>
                            <button type="button" class="input-switch" aria-pressed="false" title="Toggle input D"><span class="input-value">0</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input D" aria-label="Rename input D">✎</button>
                        </div>
                        <div class="input-row" data-input-key="E">
                            <button type="button" class="input-add" title="Add input E to canvas" aria-label="Add input E">
                                <span class="input-symbol">E</span>
                            </button>
                            <button type="button" class="input-switch" aria-pressed="false" title="Toggle input E"><span class="input-value">0</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input E" aria-label="Rename input E">✎</button>
                        </div>
                        <div class="input-row" data-input-key="F">
                            <button type="button" class="input-add" title="Add input F to canvas" aria-label="Add input F">
                                <span class="input-symbol">F</span>
                            </button>
                            <button type="button" class="input-switch" aria-pressed="false" title="Toggle input F"><span class="input-value">0</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input F" aria-label="Rename input F">✎</button>
                        </div>
                        <div class="input-row" data-input-key="G">
                            <button type="button" class="input-add" title="Add input G to canvas" aria-label="Add input G">
                                <span class="input-symbol">G</span>
                            </button>
                            <button type="button" class="input-switch" aria-pressed="false" title="Toggle input G"><span class="input-value">0</span><span class="switch-knob"></span></button>
                            <button type="button" class="input-rename" title="Rename input G" aria-label="Rename input G">✎</button>
                        </div>
                    </section>
                    <section class="component-column gates-column" aria-label="Logic gates">
                        <h4>Logic Gates</h4>
                        <button type="button" class="gate-option" data-gate="AND" title="Add AND gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5 H20 A10 10 0 0 1 20 25 H6 Z"/><path d="M1 10 H6 M1 20 H6 M30 15 H34"/></g></svg><span>AND</span></button>
                        <button type="button" class="gate-option" data-gate="OR" title="Add OR gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5 Q15 15 6 25 Q26 25 31 15 Q26 5 6 5Z"/><path d="M1 10 H9 M1 20 H9 M31 15 H34"/></g></svg><span>OR</span></button>
                        <button type="button" class="gate-option" data-gate="NOT" title="Add NOT gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5 L25 15 L6 25 Z"/><circle cx="28" cy="15" r="3"/><path d="M1 15 H6 M31 15 H34"/></g></svg><span>NOT</span></button>
                        <button type="button" class="gate-option" data-gate="NAND" title="Add NAND gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5 H19 A10 10 0 0 1 19 25 H6 Z"/><circle cx="31" cy="15" r="3"/><path d="M1 10 H6 M1 20 H6"/></g></svg><span>NAND</span></button>
                        <button type="button" class="gate-option" data-gate="NOR" title="Add NOR gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5 Q15 15 6 25 Q24 25 27 15 Q24 5 6 5Z"/><circle cx="30" cy="15" r="3"/><path d="M1 10 H9 M1 20 H9"/></g></svg><span>NOR</span></button>
                        <button type="button" class="gate-option" data-gate="XOR" title="Add XOR gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 Q12 15 3 25 M7 5 Q16 15 7 25 Q27 25 31 15 Q27 5 7 5Z"/><path d="M1 10 H7 M1 20 H7 M31 15 H34"/></g></svg><span>XOR</span></button>
                        <button type="button" class="gate-option" data-gate="XNOR" title="Add XNOR gate"><svg viewBox="0 0 36 30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 Q12 15 3 25 M7 5 Q16 15 7 25 Q24 25 27 15 Q24 5 7 5Z"/><circle cx="30" cy="15" r="3"/><path d="M1 10 H7 M1 20 H7"/></g></svg><span>XNOR</span></button>
                    </section>
                </div>
                <section class="outputs-panel" aria-label="Logic outputs">
                    <h4>Outputs <small>(LED)</small></h4>
                    <div class="output-control-row">
                        <button type="button" id="addOutputBtn" class="output-add" title="Add output to canvas" aria-label="Add output Y to canvas">
                            <span class="output-chip">Y</span>
                            <span class="output-add-label">Add Output</span>
                        </button>
                        <button type="button" id="renameOutputBtn" class="output-rename" title="Rename next output" aria-label="Rename next output">✎</button>
                        <span class="output-legend" aria-label="LED colors: red means zero, green means one">
                            <span class="legend-led zero"></span><span>0</span>
                            <span class="legend-led one"></span><span>1</span>
                        </span>
                    </div>
                </section>
            </aside>

            <div class="circuit-canvas-column">
              <div class="drawing-area" id="drawingArea">
                  <p>Drag and drop components here</p>
              </div>
              <div class="advanced-ribbon" aria-label="Advanced circuit components">
          <div class="advanced-tabs">
            <button type="button" class="advanced-tab" id="adderCategory" aria-expanded="false" aria-controls="adderChoices">Adders ▾</button>
            <button type="button" class="advanced-tab" id="comparatorCategory" aria-expanded="false" aria-controls="comparatorChoices">Comparator ▾</button>
            <button type="button" class="advanced-tab" id="encoderDecoderCategory" aria-expanded="false" aria-controls="encoderDecoderChoices">Encoder / Decoder ▾</button>
            <button type="button" class="advanced-tab" id="muxCategory" aria-expanded="false" aria-controls="muxChoices">MUX / DEMUX ▾</button>
            <button type="button" class="advanced-tab" id="latchesCategory" aria-expanded="false" aria-controls="latchesChoices">Latches ▾</button>
            <button type="button" class="advanced-tab" id="flipFlopsCategory" aria-expanded="false" aria-controls="flipFlopsChoices">Flip-Flops / CLK ▾</button>
          </div>
          <div class="advanced-choices" id="flipFlopsChoices" hidden>
            <button type="button" data-ff-kind="D">D Flip-Flop</button>
            <button type="button" data-ff-kind="SR">SR Flip-Flop</button>
            <button type="button" data-ff-kind="JK">JK Flip-Flop</button>
            <button type="button" data-ff-kind="CLOCK">CLK</button>
          </div>
          <div class="advanced-choices" id="latchesChoices" hidden>
            <button type="button" data-latch-kind="SR">SR Latch</button>
            <button type="button" data-latch-kind="D">D Latch</button>
            <button type="button" data-latch-kind="JK">JK Latch</button>
          </div>
          <div class="advanced-choices" id="muxChoices" hidden>
            <button type="button" data-mux-size="2">MUX 2×1</button>
            <button type="button" data-mux-size="4">MUX 4×1</button>
          </div>
          <div class="advanced-choices" id="encoderDecoderChoices" hidden>
            <button type="button" data-encoder-size="4">4×2</button>
            <button type="button" data-encoder-size="8">8×3</button>
            <button type="button" data-encoder-size="16">16×4</button>
          </div>
          <div class="advanced-choices" id="comparatorChoices" hidden>
            <button type="button" id="addComparator">1-bit Comparator</button>
          </div>
          <div class="advanced-choices" id="adderChoices" hidden>
            <button type="button" id="addHalfAdder">Half Adder (HA)</button>
            <button type="button" id="addFullAdder">Full Adder (FA)</button>
            <button type="button" id="addParallelAdder">Parallel Adder (PA)</button>
          </div>
              </div><!-- advanced-ribbon -->
            </div><!-- circuit-canvas-column -->
        </div><!-- circuit-container -->
    </section>

</main>
    <script src="js/gates.js"></script>
    <script src="js/inputs.js"></script>
<script src="js/gate-drag.js"></script>
<script src="js/wires.js"></script>
<script src="js/wire-edit.js"></script>
<script src="js/selection.js"></script>
<script src="js/rotation.js"></script>
<script src="js/history.js"></script>
<script src="js/clipboard.js"></script>

<script src="js/wire-colors.js"></script>
<script src="js/outputs.js"></script>
<script src="js/simulation.js"></script>
<script src="js/boolean-equations.js"></script>
<script src="js/truth-table.js"></script>
<script src="js/timing-diagram.js"></script>
<script src="js/karnaugh-map.js"></script>
<script src="js/results-alignment.js"></script>
<script src="js/credits.js"></script>
<script src="js/open-wires.js"></script>
<script src="js/wire-jumps.js"></script>
<script src="js/group-actions.js"></script>
    <script src="js/boolean-algebra.js"></script>
    <script src="js/advanced-placement.js"></script>
    <script src="js/half-adder.js"></script>
    <script src="js/full-adder.js"></script>
    <script src="js/parallel-adder.js"></script>
    <script src="js/comparator.js"></script>
    <script src="js/encoder-decoder.js"></script>
    <script src="js/mux.js"></script>
    <script src="js/latches.js"></script>
    <script src="js/flip-flops.js"></script>
    <script src="js/master-slave.js"></script>
    <script src="js/advanced-dropdown-position.js"></script>
    <script src="js/wire-net-resolver.js"></script>
    <script src="js/wire-connection-check.js"></script>
    <script src="js/report-layout.js"></script>
    <script src="js/pdf-export.js"></script>
    <script src="js/toolbar-manager.js"></script>
</body>
</html>
